server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles URLs like /groups/1 in the browser. If someone opens or refreshes
    # such a URL, there is no real file for it, so send index.html and let React take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
