# Runs the whole app with one command:  docker compose up --build
#   Frontend: http://localhost:8080
#   API docs: http://localhost:8000/docs
#
# The password below is a development default. Override it in a .env file for anything real.

services:
  db:
    # PostgreSQL, the same database the live deployment uses (dev/prod parity).
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: splitkaro
      POSTGRES_USER: splitkaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitkaro-dev-password}
    volumes:
      # Keeps the data when containers are recreated. `docker compose down -v` deletes it.
      - pg-data:/var/lib/postgresql/data
    # No "ports:" on purpose: only the api container needs to reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitkaro -d splitkaro"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      # "db" is the service name above: containers find each other by name.
      DATABASE_URL: postgresql://splitkaro:${POSTGRES_PASSWORD:-splitkaro-dev-password}@db:5432/splitkaro
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-in-production}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000" # your computer's port : the container's port
    depends_on:
      db:
        condition: service_healthy # wait until the database is ready, not just started
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is the address as seen from your computer.
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pg-data:
